# Aurora demo console — static page + same-origin reverse proxy to services.
# Serving the UI and the APIs from ONE origin (localhost:8090) avoids CORS
# entirely; none of the Go/Python services need browser headers.
# Dev-only convenience — the real edge gateway is M10.

server {
    listen 8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # ---- service proxies (trailing slash strips the /api/<svc> prefix) ----
    location /api/identity/ { proxy_pass http://identity-svc:8081/; }
    location /api/ai/       { proxy_pass http://ai-agent-svc:8082/; }
    location /api/wallet/   { proxy_pass http://wallet-svc:8083/; }
    location /api/room/     { proxy_pass http://room-svc:8084/; }
    location /api/bet/      { proxy_pass http://bet-svc:8086/; }
    location /api/graph/    { proxy_pass http://graph-svc:8087/; }
    location /api/nats/     { proxy_pass http://nats:8222/; }

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;   # ProposeAiPool can take up to ~30s with a real LLM
    proxy_send_timeout    10s;
}
